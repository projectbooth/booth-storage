# Local stand-ins for the external services the backend + registry tests talk to. CI runs
# the same images (see .github/workflows/ci.yml), so a green local run means the same
# thing a green CI run does. Not used at runtime — this is test tooling only.
#
#   docker compose -f hack/docker-compose.emulators.yml up -d --wait
#   hack/seaweedfs-seed-admin.sh      # seaweedfs boots with zero IAM identities
#   eval "$(hack/test-env.sh)"        # export the BOOTH_TEST_* variables (bash/zsh)
#   go test ./...
#   docker compose -f hack/docker-compose.emulators.yml down -v
#
# GCS needs no container: its tests use fake-gcs-server in-process.
services:
  minio:
    # ADR 0087/0091: quay.io/minio/minio refuses anonymous pulls entirely now (verified
    # directly: even a specific digest 401s, not just `:latest`). This is booth-lakehouse's
    # own already-working cached copy, published to ghcr.io/projectbooth/minio-test and
    # pinned by digest — the one shared mirror both modules point at, so they test against
    # the literal same MinIO build rather than two independently-chosen ones.
    # $MINIO_TEST_IMAGE overrides it, matching booth-lakehouse's own hack/docker-compose.yml.
    image: ${MINIO_TEST_IMAGE:-ghcr.io/projectbooth/minio-test@sha256:04c918e8877a410f40ccab0842f724177af453f236a5fda96df219867aefe3c3}
    command: server /data
    environment:
      MINIO_ROOT_USER: booth-test
      MINIO_ROOT_PASSWORD: booth-test-secret
    ports: ["19000:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 5s
      retries: 30

  seaweedfs:
    # chrislusf/seaweedfs 4.48, pinned by digest, not tag (same discipline as minio
    # above — ADR 0087/0091's own finding that even a specific digest can stop being
    # pullable). The exact digest both design-note spikes ran (docs/design-seaweedfs-
    # iam-spike.md, docs/design-seaweedfs-provider.md). Embedded S3 + IAM on the same
    # port: the seaweedfs-iam credential-broker path (internal/backend/s3) mints IAM
    # users/keys against this container the same way it will against the real homelab
    # install (ADR 0118).
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -s3
      - -s3.ip.bind=0.0.0.0
      - -s3.iam
      - -s3.iam.readOnly=false
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -dir=/data
      - -ip.bind=0.0.0.0
    volumes:
      - ./seaweedfs-iam.json:/etc/seaweedfs/iam.json:ro
    ports: ["19333:8333"]
    # No container healthcheck here (unlike the services above): the image has neither
    # mc nor nc to probe with. hack/test-env.sh's caller polls the S3 port directly
    # instead, then seeds the one admin identity the server boots with none of (see
    # hack/seaweedfs-seed-admin.sh) — both steps need to run after `up --wait` either way.

  nats:
    # Official nats-server image, pinned by digest (same discipline as minio/seaweedfs
    # above). -js enables JetStream; internal/eventbus provisions the BOOTH_EVENTS
    # stream itself in tests (ADR 0026 normally has booth-core do this in a real
    # cluster — there is no core here to do it).
    image: ${NATS_TEST_IMAGE:-nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927}
    command: ["-js"]
    ports: ["14222:4222"]
    # No container healthcheck (the image has neither mc nor nc to probe with, same as
    # seaweedfs above); the test harness retries its own connection instead.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: booth-test
      POSTGRES_DB: booth_storage_test
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth_storage_test"]
      interval: 2s
      timeout: 5s
      retries: 30
