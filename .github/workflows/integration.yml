name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): real-cluster integration tests. Runs
# on merge to main and nightly, not on every push/PR — it's the slower "actually deployed
# to a real cluster" layer. See test/integration/README.md for exactly what this covers
# and what's still missing: deploying alongside a real, pinned booth-core release (a build
# exists as of booth-core v0.1.1, but pulling it needs a cross-repo credential; not wired up
# yet). NOTE: this workflow has not been executed yet — no kind/k3d was available when it
# was written; it was linted with actionlint and its Go test compiles. Expect to shake out
# first-run issues.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kind-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: helm/kind-action@v1
        with:
          cluster_name: booth-storage-ci

      - uses: azure/setup-helm@v4

      - name: Build and load booth-storage image
        run: |
          docker build -t booth-storage:ci .
          kind load docker-image booth-storage:ci --name booth-storage-ci

      - name: Install vendored BoothModule CRD (see test/integration/fixtures)
        run: kubectl apply -f test/integration/fixtures/boothmodule-crd.yaml

      - name: Deploy a PostgreSQL for the module's database (ADR 0014)
        run: |
          kubectl create namespace booth-storage
          kubectl apply -n booth-storage -f test/integration/fixtures/postgres.yaml
          kubectl -n booth-storage rollout status deployment/postgres --timeout=180s

      - name: Install booth-storage chart
        working-directory: charts/booth-storage
        run: |
          helm install booth-storage . \
            --namespace booth-storage \
            --set image.repository=booth-storage \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set oidc.issuerUrl=https://accounts.google.com \
            --set oidc.clientId=booth-storage-ci \
            --set oidc.requireAudience=false \
            --set 'filesystem.roots[0]=/data/{workspace}' \
            --wait --timeout 5m

      - name: Verify rollout and registration (ADR 0019)
        run: |
          kubectl -n booth-storage get pods
          kubectl -n booth-storage rollout status deployment/booth-storage --timeout=120s
          kubectl -n booth-storage get boothmodules.booth.projectbooth.io storage -o yaml
          # Both views must be declared on the live resource (ADR 0036).
          test "$(kubectl -n booth-storage get boothmodules.booth.projectbooth.io storage -o jsonpath='{.spec.navPath}')" = "/storage"
          test "$(kubectl -n booth-storage get boothmodules.booth.projectbooth.io storage -o jsonpath='{.spec.adminNavPath}')" = "/storage/admin"
          # ADR 0053/0054: the live resource must ask booth-core for a database. (If the vendored
          # CRD didn't know the field the API server would silently drop it, so this also guards
          # against the fixture going stale.)
          test "$(kubectl -n booth-storage get boothmodules.booth.projectbooth.io storage -o jsonpath='{.spec.database.enabled}')" = "true"

      - name: Verify /healthz through the Service (a 200 means migrations ran and Postgres is reachable)
        run: |
          # `-i` is required here: `kubectl run --rm` refuses to run at all without an attached
          # container ("--rm should only be used for attached containers"). This step's result is
          # kubectl run's own exit code (curl -sf's, unretrieved via $(...)), never captured
          # stdout text, so it isn't exposed to the attach-race fixed below.
          kubectl -n booth-storage run curl-check --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf http://booth-storage.booth-storage.svc.cluster.local:8080/healthz

      - name: Verify the API refuses unauthenticated requests in-cluster
        run: |
          # `kubectl run --rm` appends its own "pod deleted" line, so match rather than compare.
          # `kubectl run --rm -i` has an observed, unrelated-to-this-repo race (same one
          # booth-catalog hit and fixed, its integration.yml commits e979a63/3c1b330): when
          # attach is slow to connect to a container as fast-finishing as `curl`, the
          # container's real stdout can be missed entirely, and kubectl's OWN "All commands and
          # output from this session will be recorded..." banner — which shares the same stdout
          # stream — is all that ends up captured. A plain non-empty check doesn't catch this
          # (the banner text is non-empty too); keep only a line that actually looks like our
          # `status=NNN` response. Retry only when that's absent, with a unique pod name per
          # attempt (a prior attempt's pod may still be deleting); once found, the 401 check
          # runs exactly once, unretried, so a genuinely wrong status still fails the step.
          status=""
          for attempt in 1 2 3; do
            raw="$(kubectl -n booth-storage run curl-authz-$attempt --rm -i --restart=Never --image=curlimages/curl -- \
              curl -s -o /dev/null -w 'status=%{http_code}' http://booth-storage.booth-storage.svc.cluster.local:8080/api/backends || true)"
            status="$(printf '%s\n' "$raw" | grep -o 'status=[0-9]\{3\}' | head -n1 || true)"
            if [ -n "$status" ]; then
              break
            fi
            echo "attempt $attempt: kubectl/curl returned no usable response (got: ${raw:-<nothing>}), retrying…" >&2
            sleep 2
          done
          if [ -z "$status" ]; then
            echo "no response after 3 attempts"; exit 1
          fi
          echo "$status"
          echo "$status" | grep -q 'status=401'

      - name: Verify RBAC is exactly what ADR 0020 needs, and no more
        run: |
          sa="system:serviceaccount:booth-storage:booth-storage"
          allowed() { test "$(kubectl auth can-i "$@" --as="$sa")" = "yes" || { echo "unexpectedly DENIED: $*"; exit 1; }; }
          denied()  { test "$(kubectl auth can-i "$@" --as="$sa")" = "no"  || { echo "unexpectedly ALLOWED: $*"; exit 1; }; }

          for verb in get create update delete; do
            allowed "$verb" secrets -n booth-storage
          done
          # Nothing beyond that: no listing/watching secrets, nothing in other namespaces.
          denied list secrets -n booth-storage
          denied watch secrets -n booth-storage
          denied get secrets -n kube-system
          denied create secrets -n kube-system
          denied get pods -n booth-storage

      - name: Credential Secrets provision on a real API server (ADR 0020)
        env:
          BOOTH_IT_NAMESPACE: booth-storage
        run: go test -tags integration -count=1 -v ./test/integration/...

      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl -n booth-storage get all
          kubectl -n booth-storage logs deployment/booth-storage --tail=200 || true
