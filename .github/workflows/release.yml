name: Release

# Publishes the container image and the Helm chart at a matching version, so
# booth-module-store's bundled catalog (and anyone installing via booth-core's install
# API) has a real chart reference to point at, and other repos' layer-3 tests can pin to a
# known-good build instead of main. Mirrors booth-core's release workflow.
# Pushing a `vX.Y.Z` tag triggers it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/projectbooth/booth-storage:${{ steps.version.outputs.version }}
            ghcr.io/projectbooth/booth-storage:latest

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package chart at the release version
        working-directory: charts/booth-storage
        run: |
          helm package . \
            --version "${{ needs.image.outputs.version }}" \
            --app-version "${{ needs.image.outputs.version }}" \
            --destination ../../dist

      - name: Attach chart to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
