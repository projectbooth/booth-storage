name: Publish UI package

# ADR 0030: booth-design consumes @projectbooth/storage-ui as an ordinary npm dependency
# (its src/lib/nativeModules.ts registry), so this package has to actually exist somewhere
# installable, not just live inside this repo. Published to GitHub Packages
# (npm.pkg.github.com) rather than public npm, matching booth-module-store's setup for the
# same reason: a private org with no public-npm org account.
on:
  push:
    tags:
      - "storage-ui-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@projectbooth"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck, lint, test (don't publish something CI hasn't verified)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run

      - run: npm run build

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
