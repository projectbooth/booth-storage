# A throwaway PostgreSQL for the integration test cluster, standing in for the shared
# platform database (ADR 0014) that a real deployment provisions a role/database on.
# Test fixture only — fixed credentials, no persistence.
apiVersion: v1
kind: Secret
metadata:
  name: booth-storage-db
type: Opaque
stringData:
  dsn: postgres://booth:booth-test@postgres:5432/booth_storage?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: booth}
            - {name: POSTGRES_PASSWORD, value: booth-test}
            - {name: POSTGRES_DB, value: booth_storage}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "booth", "-d", "booth_storage"]
            initialDelaySeconds: 3
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
