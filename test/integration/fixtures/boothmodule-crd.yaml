# Vendored copy of booth-core's BoothModule CRD (charts/booth-core/crds/
# booth.projectbooth.io_boothmodules.yaml, ADR 0019). We don't own this type — core
# does — but our real-cluster integration test needs it present in the kind cluster to
# apply our own chart's BoothModule instance (templates/boothmodule.yaml), including its
# adminNavPath field (ADR 0023/0036).
#
# This is a stopgap until booth-core publishes a pinned, referenceable build our CI can
# install CRDs from directly (contracts/testing-strategy.md's "booth-core should publish a
# versioned, referenceable build other repos' CI can pin to"). Keep this in sync with
# booth-core's CRD by hand until then.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: boothmodules.booth.projectbooth.io
spec:
  group: booth.projectbooth.io
  names:
    kind: BoothModule
    listKind: BoothModuleList
    plural: boothmodules
    singular: boothmodule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BoothModule is the Kubernetes-native transport for a module's manifest
          (contracts/module-manifest.md), per ADR 0019. One instance per installed module,
          created/updated by that module's Helm chart on install, removed on uninstall.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BoothModuleSpec is the Kubernetes-native transport for contracts/module-manifest.md.
              Field-for-field, this must match that contract's table.
            properties:
              adminNavPath:
                description: |-
                  AdminNavPath is an optional distinct route the shell renders for a user with
                  an admin/owner-level workspace role, alongside NavPath for everyone else
                  (ADR 0023). Most modules should omit this.
                type: string
              contractVersion:
                description: |-
                  ContractVersion is the module-manifest.md + core-platform-api.md contract
                  version this module targets. Core supports current and previous major.
                type: string
              displayName:
                description: DisplayName is the human-readable name shown in the shell
                  UI.
                type: string
              hasOwnUi:
                description: HasOwnUI declares whether this module ships a UI to surface
                  in the shell.
                type: boolean
              healthCheckPath:
                description: |-
                  HealthCheckPath is the path core polls (via ServiceRef) to determine module
                  health/availability.
                type: string
              icon:
                description: |-
                  Icon is a free-form icon identifier. Unrecognized values fall back to a
                  default glyph in the shell.
                type: string
              id:
                description: |-
                  ID is the stable, unique module id, e.g. "storage", "catalog". Matches the
                  manifest contract's `id` field.
                pattern: ^[a-z][a-z0-9-]*$
                type: string
              navGroup:
                description: |-
                  NavGroup determines which of the shell's three nav sections (build/view/
                  manage) the module's entry appears under (ADR 0017). Required when HasOwnUI
                  is true.
                enum:
                - build
                - view
                - manage
                type: string
              navPath:
                description: |-
                  NavPath is where this module attaches in the shell's navigation. Required
                  when HasOwnUI is true.
                type: string
              requiredScopes:
                description: RequiredScopes lists auth scopes the module needs core
                  to grant it access to.
                items:
                  type: string
                type: array
              serviceRef:
                description: |-
                  ServiceRef points at the in-cluster Service backing this module. Not part of
                  the manifest contract itself — infrastructure the chart adds so the gateway
                  and health-check reconciler have somewhere to route to.
                properties:
                  name:
                    description: Name of the Kubernetes Service backing this module.
                    type: string
                  namespace:
                    description: |-
                      Namespace the Service lives in. Defaults to the BoothModule resource's own
                      namespace if empty.
                    type: string
                  port:
                    description: Port the Service listens on for both the health check
                      and gateway routing.
                    format: int32
                    type: integer
                required:
                - name
                - port
                type: object
              uiIntegrationMode:
                description: |-
                  UIIntegrationMode is required when HasOwnUI is true: native or iframe-proxy
                  (ADR 0005).
                enum:
                - native
                - iframe-proxy
                type: string
              version:
                description: Version is the module's own release version (semver).
                type: string
            required:
            - contractVersion
            - displayName
            - hasOwnUi
            - healthCheckPath
            - id
            - serviceRef
            - version
            type: object
          status:
            description: |-
              BoothModuleStatus is populated by booth-core's registry controller, never by the
              module itself.
            properties:
              lastHealthCheckTime:
                description: LastHealthCheckTime is when Phase was last updated.
                format: date-time
                type: string
              message:
                description: Message carries human-readable detail, e.g. a health-check
                  error.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration lets a reader tell whether Status reflects the most
                  recent Spec.
                format: int64
                type: integer
              phase:
                description: Phase is the last-observed health status.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
