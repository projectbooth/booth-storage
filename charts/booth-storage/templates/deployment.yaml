apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-storage.fullname" . }}
  labels:
    {{- include "booth-storage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-storage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booth-storage.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "booth-storage.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: booth-storage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            # Credential Secrets are written to this pod's own namespace (ADR 0020).
            - name: BOOTH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BOOTH_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: BOOTH_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: BOOTH_OIDC_REQUIRE_AUDIENCE
              value: {{ .Values.oidc.requireAudience | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            - name: BOOTH_OIDC_JWKS_URL
              value: {{ .Values.oidc.jwksUrl | quote }}
            {{- with .Values.oidc.workloadIssuerUrl }}
            - name: BOOTH_WORKLOAD_ISSUER_URL
              value: {{ . | quote }}
            {{- end }}
            - name: BOOTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "booth-storage.dsnSecretName" . }}
                  key: {{ .Values.postgres.dsnSecret.key }}
            {{- with .Values.filesystem.roots }}
            - name: BOOTH_STORAGE_FILESYSTEM_ROOTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.maxUploadBytes }}
            - name: BOOTH_STORAGE_MAX_UPLOAD_BYTES
              value: {{ .Values.maxUploadBytes | int64 | quote }}
            {{- end }}
            {{- if .Values.eventBus.enabled }}
            {{- if .Values.eventBus.credentialsSecret.enabled }}
            # ADR 0123/0050: this module polls this directory and connects once both files
            # are there (internal/eventbus.LazyPublisher) — deliberately not required at
            # startup, unlike booth-api's own ADR 0123 wiring, so a pod that comes up before
            # core has provisioned the credential still starts and serves writes normally.
            - name: BOOTH_EVENT_BUS_DIR
              value: /etc/booth/event-bus
            {{- else }}
            - name: BOOTH_NATS_URL
              value: {{ required "nats.url is required when eventBus.credentialsSecret.enabled is false: with no credentials Secret to take the address from, the event bus has nowhere to connect (set eventBus.enabled=false to leave the event bus out on purpose)" .Values.nats.url | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.credentialBroker.enabled }}
            # ADR 0080/0088: core's own copy of this same value is what it presents as
            # `Authorization: Bearer` on every call to POST /internal/credentials. The pod may
            # sit in CreateContainerConfigError for a moment after install until core has
            # written this Secret, the same as the database DSN above.
            - name: BOOTH_CREDENTIAL_BROKER_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: booth-credential-broker-provider-credentials
                  key: credential
            {{- end }}
          # /livez does not look at the database on purpose: restarting the pod cannot fix
          # a Postgres outage. /healthz (readiness, and what core polls) does.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $busCreds := and .Values.eventBus.enabled .Values.eventBus.credentialsSecret.enabled }}
          {{- if or .Values.filesystem.volumeMounts $busCreds }}
          volumeMounts:
            {{- with .Values.filesystem.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $busCreds }}
            # A directory mount, deliberately not a single-file (sub-path) mount: the
            # kubelet updates a mounted Secret in place when core writes or renews the
            # credential, but never a sub-path one — exactly what lets the lazy connect
            # above pick it up with no pod restart.
            - name: event-bus-credentials
              mountPath: /etc/booth/event-bus
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.filesystem.volumes $busCreds }}
      volumes:
        {{- with .Values.filesystem.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $busCreds }}
        - name: event-bus-credentials
          secret:
            secretName: {{ .Values.eventBus.credentialsSecret.name }}
            # Unlike booth-api's own mount of this same Secret: optional, so a pod started
            # before core has provisioned the credential (or an install that never turns
            # the event bus on at the core level) mounts an empty directory instead of
            # sitting in CreateContainerConfigError. No `items` allowlist, so whichever of
            # "url"/"nats.creds" core has written so far shows up — never an error for one
            # key present without the other.
            optional: true
        {{- end }}
      {{- end }}
