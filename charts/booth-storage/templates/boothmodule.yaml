# Registers booth-storage with booth-core's module registry (ADR 0019): the BoothModule
# CRD is the only thing core reads to know this module exists
# (contracts/module-manifest.md). Uses booth-core's own CRD type
# (booth.projectbooth.io/v1alpha1), which that chart installs — not redefined here.
#
# navPath is the regular view every role sees (browse/select registered backends);
# adminNavPath is the distinct owner-only view for registering, editing and removing
# backends and their credentials (ADR 0023, ADR 0036).
apiVersion: booth.projectbooth.io/v1alpha1
kind: BoothModule
metadata:
  name: storage
  labels:
    {{- include "booth-storage.labels" . | nindent 4 }}
spec:
  id: storage
  displayName: Storage
  icon: drive
  version: {{ .Chart.AppVersion | quote }}
  contractVersion: "0.1.0"
  hasOwnUi: true
  uiIntegrationMode: native
  navGroup: manage
  navPath: /storage
  adminNavPath: /storage/admin
  healthCheckPath: /healthz
  requiredScopes:
    - storage.read
    - storage.write
  {{- if .Values.postgres.provisionedByCore }}
  # ADR 0053/0054: ask booth-core to provision this module's PostgreSQL database and role and
  # deliver them as the Secret `booth-database-credentials`. Omitting the field means core
  # provisions nothing, so it is only left out when the operator supplies their own database.
  database:
    enabled: true
  {{- end }}
  {{- if .Values.credentialBroker.enabled }}
  # ADR 0080/0088: this module mints short-lived, scoped `s3` credentials for the credential
  # broker. Declaring this is what makes core deliver the
  # booth-credential-broker-provider-credentials Secret and route matching requests here;
  # omitting it means core never routes to this module at all.
  providesCredentials:
    kinds:
      - s3
  {{- end }}
  serviceRef:
    name: {{ include "booth-storage.fullname" . }}
    port: {{ .Values.service.port }}
