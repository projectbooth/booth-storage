# Default values for booth-storage.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-storage
  tag: "" # defaults to Chart.appVersion; overridden by CI to the published tag (contracts/testing-strategy.md)
  pullPolicy: IfNotPresent

service:
  port: 8080

oidc:
  # Required: same OIDC issuer/client every module verifies against independently
  # (core-platform-api.md's defense-in-depth requirement). Left empty by default.
  issuerUrl: ""
  clientId: ""
  requireAudience: true
  # The token claim carrying workspace memberships (ADR 0025). booth-storage re-derives the
  # caller's role from it rather than trusting the gateway-forwarded X-Booth-Role, so it MUST
  # match booth-core's BOOTH_OIDC_GROUPS_CLAIM.
  groupsClaim: groups
  # Optional: booth-core's issuer URL (its in-cluster Service URL, the same value as
  # booth-core's workloadIdentity issuer), so this module also accepts core's short-lived
  # workload tokens for unattended runs, e.g. scheduled pipelines (ADR 0056). Core's keys are
  # read from <url>/.well-known/jwks.json. Empty trusts the OIDC provider only. Must differ
  # from issuerUrl.
  workloadIssuerUrl: ""

# Backend metadata (which backends exist, how they're configured — never credentials)
# lives in this module's own database on the shared PostgreSQL cluster (ADR 0014).
#
# By default booth-core provisions that database (ADR 0053/0054): the BoothModule manifest
# declares `database: {enabled: true}`, and core creates a database and unprivileged role for
# this module and delivers them as the Secret `booth-database-credentials` (key `dsn`) in this
# release's namespace. There is nothing to create by hand. The pod may sit in
# CreateContainerConfigError for a moment after install until core has written the Secret.
#
# To use your own database instead (no booth-core provisioning), set provisionedByCore to
# false and name a Secret holding the connection string in dsnSecret. This chart never
# creates the database, role or Secret itself.
postgres:
  provisionedByCore: true
  dsnSecret:
    # Empty means "booth-database-credentials" when provisionedByCore is true; required
    # (no default) when it is false.
    name: ""
    key: dsn

# Credentials for each registered backend are stored as Kubernetes Secrets in the
# release namespace (ADR 0020: booth-storage is the granting module). The Role below
# grants exactly get/create/update/delete on Secrets in this one namespace, so install
# this chart into a namespace dedicated to booth-storage — anything else that keeps
# Secrets there is readable by this module's service account.
rbac:
  create: true

# The filesystem backend kind is OFF unless roots are listed. Registering a filesystem
# backend means "let a workspace owner point storage at a directory on this server", so
# the operator decides which directories are shareable.
#
# A root containing {workspace} expands per workspace: "/data/{workspace}" lets workspace
# "acme" reach /data/acme/... and nothing else. A root without it is shared by every
# workspace (fine for a single-tenant install; a deliberate choice otherwise).
filesystem:
  roots: []
  # A registered directory that doesn't exist yet is created if its PARENT exists (so with
  # roots like /data/{workspace}, mounting /data is enough); if the parent is missing too,
  # registration is refused. Only the leaf is created — a volume that failed to mount must be
  # a loud error, not a silently-created directory on the container's ephemeral disk.
  #
  # Volumes/mounts that make those directories exist inside the pod. The image runs as
  # uid/gid 65532 with a read-only root filesystem, so mounted volumes must be writable
  # by that user (see podSecurityContext.fsGroup).
  volumes: []
  volumeMounts: []

# Cap on a single object write, in bytes. 0 = unlimited.
maxUploadBytes: 0

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

serviceAccount:
  create: true
  name: ""
